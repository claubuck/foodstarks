services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodstarks-app
    restart: unless-stopped
    # Puerto del host: local → 80, producción → 8035 (definir APP_PORT en .env)
    ports:
      - "${APP_PORT:-80}:8000"
    environment:
      APP_NAME: "${APP_NAME:-FoodStarks}"
      # production = usa assets compilados (public/build). local = intenta conectar a Vite :5173
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-foodstarks}"
      DB_USERNAME: "${DB_USERNAME:-foodstarks}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      RUN_MIGRATE: "true"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foodstarks

  postgres:
    image: postgres:16-alpine
    container_name: foodstarks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-foodstarks}"
      POSTGRES_USER: "${DB_USERNAME:-foodstarks}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foodstarks

volumes:
  postgres_data:
  storage_data:

networks:
  foodstarks:
    driver: bridge
