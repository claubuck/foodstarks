; Procesos de la aplicacion. Todos escriben a stdout/stderr para que los
; logs se vean en Dokploy. Si alguno se cae, supervisord lo reinicia.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Servidor web (PHP_CLI_SERVER_WORKERS permite atender peticiones en paralelo)
[program:web]
command=php artisan serve --host=0.0.0.0 --port=8000
environment=PHP_CLI_SERVER_WORKERS="%(ENV_WEB_WORKERS)s"
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Servidor SSR de Inertia (HTML inicial renderizado en el servidor)
[program:ssr]
command=php artisan inertia:start-ssr
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Colas (Redis) con Horizon
[program:horizon]
command=php artisan horizon
directory=/var/www/html
user=www-data
autorestart=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Servidor de websockets (Reverb). En Dokploy se publica con un dominio
; propio apuntando al puerto 8080 del contenedor.
[program:reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
