; Ajustes sobre php.ini-production (se carga después, en conf.d)

upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M

; La web corre con "artisan serve" (SAPI CLI): habilitar OPcache también ahí
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

expose_php = Off
